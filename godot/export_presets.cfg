vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>
// For every material the Compatibility renderer first builds a default program with each kind of light in it. Nothing draws with those (a draw
// without a lightmap always asks for DISABLE_LIGHTMAP), and they were 87% of the first open's wait, so they get an empty shader instead.
(function () {
	if (!window.WebGL2RenderingContext) return;
	var P = WebGL2RenderingContext.prototype, source = P.shaderSource;
	P.shaderSource = function (s, t) {
		if (t.indexOf('scene_data_block') >= 0 && t.indexOf('#define DISABLE_LIGHTMAP') < 0 && t.indexOf('#define DISABLE_LIGHT_OMNI') < 0)
			t = this.getShaderParameter(s, this.SHADER_TYPE) === this.VERTEX_SHADER
				? '#version 300 es\\nvoid main(){gl_Position=vec4(0.0);}'
				: '#version 300 es\\nprecision mediump float;out vec4 c;void main(){c=vec4(0.0);}';
		source.call(this, s, t);
	};
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
