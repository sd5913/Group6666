<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181011">
  <title>Midi Runner · The Tavern</title>
  <link rel="icon" href="index.icon.png">
  <link rel="stylesheet" href="tavern.css?v=20261124c">
  <script src="tavern-ui.js?v=20261124a" defer></script>
</head>
<body>
  <iframe id="game" class="game" src="midi-runner.html?v=20261124l" title="Midi Runner game" inert aria-hidden="true"></iframe>
  <main id="home" class="home">
    <div class="home-panel">
      <div class="home-record" aria-hidden="true"></div>
      <h1>Midi Runner</h1>
      <button id="enter-tavern" class="action" type="button" disabled>Enter the tavern <span aria-hidden="true">▸</span></button>
      <p id="boot-status" role="status">Preparing the tavern…</p>
    </div>
  </main>
  <section id="prologue" class="prologue" aria-label="The keeper's story" hidden>
    <button class="action skip-intro" id="skip-intro" type="button">Skip intro ▸</button>
    <p class="intro-caption" id="intro-caption" aria-live="polite"></p>
  </section>
  <main id="tavern" class="tavern" aria-label="The tavern" hidden>
    <div class="scene">
      <button id="counter-record" class="counter-record" type="button" aria-label="Choose a record on the turntable" disabled></button>
    </div>
    <section id="conversation" class="conversation" aria-label="Conversation with the young slime" hidden>
      <div class="conversation-copy" aria-live="polite" aria-atomic="true">
        <p class="speaker">Young Slime</p>
        <p id="dialogue" class="dialogue">I used to think my little jumps couldn't help anyone.</p>
      </div>
      <button id="continue" class="action" type="button">Continue <span aria-hidden="true">▸</span></button>
    </section>
  </main>
  <dialog id="record-picker" class="record-picker" aria-labelledby="picker-title">
    <div class="picker-top">
      <h1 id="picker-title">Choose a record</h1>
      <button class="close-picker" type="button" id="close-picker" aria-label="Back to the tavern">×</button>
    </div>
    <button id="play-record" class="record-option" type="button" autofocus>
      <span class="album-art" aria-hidden="true"><span class="album-vinyl"></span><span class="album-sleeve"></span></span>
      <span class="record-copy">
        <strong id="record-title">The Jelly Grotto</strong>
        <span id="record-level">Level 1</span>
        <span class="play-label">▶ Play record</span>
      </span>
    </button>
    <p id="launch-error" class="launch-error" role="alert" hidden></p>
  </dialog>
  <noscript><p class="noscript">Enable JavaScript to play Midi Runner.</p></noscript>
</body>
</html>
